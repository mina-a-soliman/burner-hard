name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: List generated APKs
        run: find ${{ github.workspace }} -name "*release.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleBurner-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare directory for committing APK
        run: |
          mkdir -p generated-apk

      - name: Copy APK to repository folder
        run: |
          cp app/build/outputs/apk/release/*.apk generated-apk/

      - name: Commit and push APK to repository
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated-apk/
          git commit -m "Add generated APK from CI build"
          git push
